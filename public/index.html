<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>router-win</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>router-win <span>anonymous OpenCode lane</span></h1>
  <span id="anon" class="badge">checking</span>
  <span id="poolinfo" class="badge">pool</span>
  <span class="spacer"></span>
  <button id="refresh">Refresh pool</button>
</header>

<main>
  <div>
    <section>
      <h2>Run</h2>
      <textarea id="prompt" rows="3" placeholder="say OK"></textarea>
      <div class="row">
        <button id="run" class="primary">Run</button>
        <span class="hint" id="runhint">rotates exit automatically on the free-usage limit</span>
      </div>
      <pre id="out">ready.</pre>
    </section>

    <section>
      <h2>Pool</h2>
      <table>
        <thead><tr><th></th><th>exit</th><th>transport</th><th></th></tr></thead>
        <tbody id="pool"></tbody>
      </table>
      <div class="hint">parked exits are skipped until the next refresh</div>
    </section>
  </div>

  <div>
    <section>
      <h2>Settings</h2>
      <label>model</label>
      <input type="text" id="model">
      <label>pool target</label>
      <input type="number" id="poolTarget" min="1" max="40">
      <label>pool ttl (hours)</label>
      <input type="number" id="poolTtlHours" min="1" max="168">
      <label>subscriptions (one per line)</label>
      <textarea id="subs" rows="4"></textarea>
      <div class="row"><button id="save">Save</button></div>
      <div class="hint" id="clihint"></div>
    </section>

    <section>
      <h2>Log</h2>
      <pre id="log"></pre>
    </section>
  </div>
</main>

<script src="/app.js"></script>
</body>
</html>
